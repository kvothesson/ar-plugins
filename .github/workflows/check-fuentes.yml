name: Chequeo de fuentes

# Todos los lunes 9:00 ART revisa que las URLs de los SKILL.md respondan.
# Si hay fuentes rotas abre (o actualiza) un issue con label fuente-rota;
# cuando vuelven a andar, lo cierra.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chequear fuentes
        id: chequeo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_fuentes.py --reporte reporte.md
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          cat reporte.md >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir, actualizar o cerrar el issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/issue_reporte.sh fuente-rota "Fuentes rotas en los plugins" "${{ steps.chequeo.outputs.codigo }}" reporte.md
